name: IndexNow bildirimi

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: IndexNow'a bildir
        working-directory: scripts
        run: node indexnow-ping.js
