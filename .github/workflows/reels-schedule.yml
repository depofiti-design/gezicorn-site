name: Zamanlanmış reels

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      - name: Yayınla
        working-directory: scripts
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: node publish-reels.js
      - name: Durumu kaydet
        run: |
          git config user.name "gezicorn-bot"
          git config user.email "bot@gezicorn.com"
          git add scripts/reels-queue.json
          git diff --cached --quiet || (git commit -m "Zamanlanmış reels: yayın durumu güncellendi" && git push)
