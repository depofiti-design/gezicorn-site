name: Search Console raporu

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rapor
        working-directory: scripts
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
        run: node gsc-report.js
      - name: Kaydet
        run: |
          git config user.name "gezicorn-bot"
          git config user.email "bot@gezicorn.com"
          git add seo-reports
          git diff --cached --quiet || (git commit -m "SEO raporu $(date -u +%F)" && git push)
