<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yazıları Filtrele | Gezicorn</title>
<meta name="description" content="Vize kuralları, gönüllü fırsatları, gezi rehberleri ve site haberleri. Kırgızistan'dan Kamboçya'ya kendi rotamızdan ve Türk pasaportuna göre.">
<meta property="og:type" content="website">
<meta property="og:title" content="Gezicorn: Yazılar">
<meta property="og:description" content="Vize kuralları, gönüllü fırsatları ve gezi rehberleri, Türk pasaportuna göre.">
<meta property="og:image" content="https://d8j0ntlcm91z4.cloudfront.net/user_3BISX51pyjgR1WlirlUH7qpCMcW/hf_20260704_233315_b105ab07-b70d-41a8-8dbc-607946d69068.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://www.gezicorn.com/yazi/">
<link rel="icon" type="image/png" href="/logo-256.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/gz.css?v=20260920b">
<style>
.header{max-width:1220px;margin:0 auto;padding:36px clamp(16px,4vw,44px) 18px}
.header h1{font:800 clamp(32px,5vw,54px)/1 var(--f-display);letter-spacing:-.035em;margin-bottom:10px}
.header p{color:var(--muted);max-width:40em}
.filters{display:flex;gap:10px;padding:0 clamp(16px,4vw,44px) 20px;max-width:1220px;margin:0 auto;flex-wrap:wrap}
.filter-btn{padding:8px 16px;border-radius:99px;border:2.5px solid var(--ink);background:var(--paper);font:800 13px var(--f-body);box-shadow:2px 2px 0 var(--ink)}
.filter-btn.active,.filter-btn:hover{background:var(--yl)}
.country-filters{padding-top:0}
.filter-label{width:100%;font:600 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.filter-btn.country{font-size:12.5px;padding:6px 13px}
.filter-btn.country.active{background:var(--teal);color:#fff}
.grid{max-width:1220px;margin:0 auto;padding:0 clamp(16px,4vw,44px) 70px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.empty{color:var(--muted);padding:20px 0}
</style>
</head>
<body>

<header class="gz-nav"><a class="gz-brand" href="/"><img src="/logo-128.png" alt="Gezicorn logo" width="38" height="38"><span>gezicorn</span></a><ul class="gz-links"><li><a href="/yazi/">Tüm yazılar</a></li><li><a class="hl" href="/danismanlik.html">Danışmanlık</a></li></ul></header>

<div class="header">
  <h1 id="pageTitle">Yazılar</h1>
  <p id="pageDesc">Vize kuralları, gönüllü fırsatları ve gezi rehberleri, Kırgızistan'dan Kamboçya'ya kendi rotamızdan ve Türk pasaportuna göre.</p>
</div>

<div class="filters" id="filters">
  <a class="filter-btn" data-cat="all" href="posts.html">Tümü</a>
  <a class="filter-btn" data-cat="vize" href="posts.html?category=vize">Vize &amp; ülkeler</a>
  <a class="filter-btn" data-cat="firsat" href="posts.html?category=firsat">Gönüllü &amp; fırsatlar</a>
  <a class="filter-btn" data-cat="rehber" href="posts.html?category=rehber">Gezi rehberleri</a>
  <a class="filter-btn" data-cat="haber" href="posts.html?category=haber">Haberler &amp; gelişmeler</a>
</div>

<div class="filters country-filters" id="countryFilters">
  <span class="filter-label">Ülkeye göre:</span>
</div>

<div class="grid" id="postsGrid"></div>

<footer class="gz-foot"><div class="row"><p>© Gezicorn</p></div></footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBTMRufCWKbfrLBN3WiVDWCjzrpxMhrFmc",
  authDomain: "gezicorn.firebaseapp.com",
  projectId: "gezicorn",
  storageBucket: "gezicorn.firebasestorage.app",
  messagingSenderId: "542127745680",
  appId: "1:542127745680:web:c59e7919eb0e78865c0615"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const labels = {vize:'vize', firsat:'fırsat', rehber:'rehber', haber:'haber'};
function ts(d){ return d.created_at && d.created_at.seconds ? d.created_at.seconds : 0; }

const params = new URLSearchParams(window.location.search);
const activeCat = params.get('category') || 'all';
const activeCountry = params.get('country') || '';

document.querySelectorAll('.filter-btn').forEach(btn=>{
  if(btn.dataset.cat === activeCat) btn.classList.add('active');
});

if(activeCountry){
  document.getElementById('pageTitle').textContent = activeCountry;
  document.getElementById('pageDesc').textContent = `${activeCountry} hakkında yazdığımız tüm yazılar.`;
}

function mentionsCountry(post, country){
  const hay = (post.title + ' ' + (post.excerpt||'')).toLocaleLowerCase('tr');
  return hay.includes(country.toLocaleLowerCase('tr'));
}

async function loadCountries(){
  try{
    const snap = await db.collection('countries').where('visited','==',true).get();
    const names = snap.docs.map(d=>d.data().name).sort();
    const el = document.getElementById('countryFilters');
    const allHref = activeCat === 'all' ? 'posts.html' : `posts.html?category=${activeCat}`;
    el.innerHTML = `<span class="filter-label">Ülkeye göre:</span>
      <a class="filter-btn country${!activeCountry?' active':''}" href="${allHref}">Tümü</a>` +
      names.map(name => {
        const href = `posts.html?country=${encodeURIComponent(name)}${activeCat!=='all' ? '&category='+activeCat : ''}`;
        const isActive = activeCountry.toLocaleLowerCase('tr') === name.toLocaleLowerCase('tr');
        return `<a class="filter-btn country${isActive?' active':''}" href="${href}">${name}</a>`;
      }).join('');
  }catch(e){}
}

async function loadPosts(){
  try{
    const snap = await db.collection('posts').where('published','==',true).get();
    let data = snap.docs.map(d=>d.data()).sort((a,b)=>ts(b)-ts(a));
    if(activeCat !== 'all'){
      data = data.filter(p => p.category === activeCat);
    }
    if(activeCountry){
      data = data.filter(p => mentionsCountry(p, activeCountry));
    }
    const el = document.getElementById('postsGrid');
    el.innerHTML = data.map(p=>`
      <a class="tagcard" href="/yazi/${encodeURIComponent(p.slug)}/">
        <img src="${(p.cover_image||'/img/covers/_default.jpg').replace('https://www.gezicorn.com','')}" alt="${p.title}" loading="lazy">
        <span class="chip ${p.category}">${labels[p.category]||p.category}</span>
        <h3>${p.title}</h3>
        <p>${p.excerpt||''}</p>
      </a>`).join('') || '<p class="empty">Bu filtrede henüz yazı yok.</p>';
  }catch(e){
    document.getElementById('postsGrid').innerHTML = '<p class="empty">Yazılar yüklenemedi.</p>';
  }
}

loadPosts();
loadCountries();
</script>
</body>
</html>
