<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı | Gezicorn</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/logo-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Nunito+Sans:wght@400;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/assets/gz.css?v=20260920b">
<style>
.lost{min-height:calc(100vh - 140px);display:grid;place-items:center;padding:40px clamp(16px,4vw,44px)}
.lost .in{max-width:560px;text-align:center}
.lost img{width:min(260px,60vw);margin:0 auto 10px;display:block;filter:drop-shadow(0 20px 16px rgba(0,0,0,.25));animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{translate:0 -10px}}
.lost .code{display:inline-block;font:600 12px var(--f-mono);letter-spacing:.1em;background:var(--yl);border:2px solid var(--ink);border-radius:99px;padding:4px 12px;margin-bottom:12px}
.lost h1{font:800 clamp(34px,6vw,54px)/1 var(--f-display);letter-spacing:-.035em;margin-bottom:12px}
.lost p{color:var(--muted);margin-bottom:22px}
.lost .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<header class="gz-nav"><a class="gz-brand" href="/"><img src="/logo-128.png" alt="Gezicorn logo" width="38" height="38"><span>gezicorn</span></a></header>
<main class="lost"><div class="in">
  <img src="/assets/3d/suitcase.webp" alt="" width="260" height="260">
  <span class="code">404</span>
  <h1>Bavul yanlış havalimanına gitmiş</h1>
  <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfadan devam edebilir ya da rehberlere göz atabilirsin.</p>
  <div class="row"><a class="btn yl" href="/">Ana sayfaya dön</a><a class="btn alt" href="/yazi/">Tüm rehberler</a></div>
</div></main>
</body>
</html>
